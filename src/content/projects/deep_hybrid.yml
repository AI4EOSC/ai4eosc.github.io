type: origin
status: finished
title: DEEP-HybridDataCloud
tagline: Designing and Enabling E-infrastructures for intensive Processing in a Hybrid DataCloud.
description: Supporting artificial intelligence (machine learning and deep learning), parallel post-processing of very large data, and analysis of massive online data streams over distributed e-Infrastructures in the EOSC. Provided a DevOps-based toolchain and a GPU testbed to raise existing services to TRL8, with pilot applications in biology, physics and network security. Its platform has since been superseded by AI4EOSC.
